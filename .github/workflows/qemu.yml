name: Cortex-M33 QEMU tests
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  busfault:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Install Arm tools and QEMU
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends gcc-arm-none-eabi qemu-system-arm
      - name: Run instruction tests
        run: python3 test/qemu/matrix/run.py
